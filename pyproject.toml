[project]
name = "pte"
version = "0.1.0"
description = "Purchase propensity targeting & experimentation platform on e-commerce event data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "sqlfluff>=3",
]
# Optional: nothing in src/ imports pyspark yet, so CI does not install it.
# Spark needs Linux here; on Windows its Hadoop layer misses native libraries.
spark = [
    "pyspark>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pte"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
